name: PHP Performance Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-version: [ '8.4', '8.5' ]

    name: PHP ${{ matrix.php-version }} performance test on ${{ matrix.operating-system }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          ini-values: opcache.enable_cli=1

      - name: Check PHP version
        run: php -v

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-${{ matrix.operating-system }}-php-${{ steps.php.outputs.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.operating-system }}-php-${{ steps.php.outputs.php-version }}

      - if: steps.composer-cache.outputs.cache-hit != 'true'
        name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Diagnose PHP startup and test discovery
        shell: bash
        run: |
          php --ini
          php -i | grep -E 'opcache\.|JIT|Opcode Caching'
          set +e
          for settings in baseline no-jit no-optimization no-opcache; do
            args=()
            case "$settings" in
              no-jit) args=(-d opcache.jit=disable -d opcache.jit_buffer_size=0);;
              no-optimization) args=(-d opcache.optimization_level=0);;
              no-opcache) args=(-d opcache.enable_cli=0);;
            esac
            printf '\nConfiguration: %s\n' "$settings"
            timeout 20s php "${args[@]}" vendor/bin/phpunit --version
            printf 'Version exit: %s\n' "$?"
            timeout 20s php "${args[@]}" vendor/bin/phpunit --testsuite=Performance --list-tests
            printf 'Discovery exit: %s\n' "$?"
          done
      - name: Verify performance with JIT disabled and OPcache enabled
        run: |
          grep -R -n -E 'opcache.jit|jit_buffer' /etc/php/${{ matrix.php-version }}/cli || true
          printf 'opcache.jit=disable\nopcache.jit_buffer_size=0\n' | sudo tee /etc/php/${{ matrix.php-version }}/cli/conf.d/99-zz-disable-jit.ini
          php -r '$s = opcache_get_status(false); var_export(["opcache_enabled" => $s["opcache_enabled"], "jit" => $s["jit"]]); if (!$s["opcache_enabled"] || $s["jit"]["enabled"]) { exit(1); }'
          vendor/bin/phpunit --testsuite=Performance --display-notices
